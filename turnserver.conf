# turnserver.conf — minimal self-hosted TURN server config for coturn.
# Used by the `turn` service in docker-compose.yml.
#
# IMPORTANT: change `static-auth-secret` to a long random value, and use the SAME
# value for the backend's TURN_SECRET env var. Generate one with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

listening-port=3478
tls-listening-port=5349

# Replace with your server's actual public IP/domain in production.
realm=yourdomain.com

use-auth-secret
static-auth-secret=change-this-to-a-long-random-secret-and-match-TURN_SECRET-in-backend-env

# Relay port range must be opened in your firewall/security group (UDP).
min-port=49152
max-port=65535

# Don't relay to/from other private networks (basic SSRF-style protection).
no-multicast-peers
no-cli

log-file=stdout
